[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footless"
version = "0.1.0"
description = "An inference engine that knows nothing about models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
footless = "footless.cli:main"

[tool.setuptools]
packages = ["footless"]
